name: Update Parhana egg prices

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-eggs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract official Parhana egg prices
        run: node scripts/update-parhana-eggs.mjs

      - name: Commit changed prices
        run: |
          if git diff --quiet -- data/prices.json; then
            echo 'No verified price change detected.'
            exit 0
          fi
          git config user.name 'gheymat-rooz-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json
          git commit -m 'chore: update daily Parhana egg prices'
          git push
