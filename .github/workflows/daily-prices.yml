name: Daily price update

on:
  schedule:
    # 03:30 UTC = 07:00 Tehran in standard time; the script also uses
    # Asia/Tehran internally so the displayed timestamp is always local.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and validate prices
        run: node scripts/update-prices.mjs

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "chore: update daily prices"
          git push
